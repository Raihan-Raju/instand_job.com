$kind: http-example
name: password/reset
request:
  url: http://127.0.0.1:8000/api/v1/auth/forgot-password/reset
  method: POST
  body:
    type: json
    content: "{\r

      \  \"mobile\": \"01516125589\",\r

      \  \"reset_token\": \"NFoQA8wHMjWSd23IIiowMyMHyd1VmoyTjAeuNKq3YJ4xxTF9SqaIeN9uTOwwqeXl\",\r

      \  \"password\": \"01516125589\",\r

      \  \"password_confirmation\": \"01516125589\"\r

      }"
response:
  statusCode: 200
  statusText: OK
  headers:
    host: 127.0.0.1:8000
    connection: close
    x-powered-by: PHP/8.2.18
    cache-control: no-cache, private
    date: Mon, 19 Oct 2026 04:47:40 GMT
    content-type: application/json
    x-ratelimit-limit: "5"
    x-ratelimit-remaining: "4"
    access-control-allow-origin: "*"
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Password reset successfully. Please login again."
      }
order: 1000
