$kind: http-example
name: http://127.0.0.1:8000/api/v1/auth/forgot-password/send-otp
request:
  url: http://127.0.0.1:8000/api/v1/auth/forgot-password/send-otp
  method: POST
  body:
    type: json
    content: "{\r

      \    \"mobile\": \"01516125589\"\r

      }"
response:
  statusCode: 200
  statusText: OK
  headers:
    host: 127.0.0.1:8000
    connection: close
    x-powered-by: PHP/8.2.18
    cache-control: no-cache, private
    date: Mon, 19 Oct 2026 04:26:54 GMT
    content-type: application/json
    x-ratelimit-limit: "3"
    x-ratelimit-remaining: "2"
    access-control-allow-origin: "*"
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "If the mobile number is registered, an OTP has been sent."
      }
order: 1000
